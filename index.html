<style>
:root{--y:#FFC82C;--o:#FF6B35;--ink:#1E293B;--g:#10B981;--b:#0EA5E9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(26deg)}}

@keyframes wave{to{transform:translateX(-200px)}}

const _r=render;render=function(){if(isS()&&!S.aid){S.aid=Date.now().toString(36)+Math.random().toString(36).slice(2,6)}_r();
 const key=S.i+":"+S.qi,sc=SC[S.i][0],m=$("main");if(sc=="end")S.fin=1;
 if(key!=lastKey){tick();lastSc=sc;lastKey=key;m.classList.remove("in");void m.offsetWidth;m.classList.add("in");if(!pend)say(sc=="end"&&pts()>=D.max*.8?"ما شاء الله! رحلة موفقة يا مستكشف أفريقيا!":GM[sc])}
 if(pend){const r=pend;pend=null;if(r=="ok"){say(rnd(OKM));snd.ok();confetti()}else if(r=="hint"){say(rnd(HM));snd.bad()}else{say(rnd(RM));snd.bad()}}
 if(pts()>lastPts){const e=$("#pts");e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}lastPts=pts();
 const gb=$("#globe");if(gb)gb.appendChild(mkGlobe())};
/* ===== شاشة الدخول ===== */
const GT=document.createElement("div");GT.id="gate";GT.hidden=true;document.body.appendChild(GT);
const DS=document.createElement("div");DS.id="dash";DS.hidden=true;document.body.appendChild(DS);
function gate(v,msg){GT.hidden=false;DS.hidden=true;$("#out").hidden=true;
 const err=msg?`<div class="err" role="alert">${msg}</div>`:"";const back=`<button class="btn" data-g="choose">رجوع</button>`;let b;
 if(v=="choose")b=`<h1>قارة أفريقيا</h1><p class="sub">الدراسات الاجتماعية · الصف الأول الإعدادي</p><button class="btn pri big" data-g="student">👦 أنا طالب</button><button class="btn big" data-g="teacher">👨‍🏫 أنا معلم</button><button class="btn" data-h="student">❓ كيف أستخدم الموقع؟</button>${err}`;
 else if(v=="student")b=`<h2>دخول الطالب</h2><p>سجّل دخولك بحساب جوجل لتبدأ الدرس.</p><div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div>${demo()?`<p class="sub">لم يتم ربط جوجل بعد (CLIENT_ID).</p><button class="btn" data-g="demo">دخول تجريبي</button>`:""}${err}<p>${back}</p>`;
 else if(v=="profile")b=`<h2>أهلًا ${esc(U.name||"")}!</h2><label>اسمك الكامل<input id="nm" value="${esc(U.name||"")}" autocomplete="name"></label><label>فصلك (مثال: 1/3)<input id="cl" value="${esc(U.cls||"")}"></label>${err}<button class="btn pri big" data-g="go">متابعة</button>`;
 else if(v=="resume")b=`<h2>لقيت لك رحلة لم تكتمل</h2><p>هل تحب أن تكمل من حيث توقفت أم تبدأ محاولة جديدة؟</p><button class="btn pri big" data-g="cont">أكمل من حيث توقفت</button><button class="btn big" data-g="new">ابدأ محاولة جديدة</button>`;
 else if(v=="teacher")b=`<h2>دخول المعلم</h2><label>كلمة السر<input id="pw" type="password" autocomplete="current-password"></label>${err}<button class="btn pri big" data-g="tlogin">دخول</button><p><button class="btn" data-h="teacher">❓ شرح لوحة المعلم</button> ${back}</p>`;
 GT.innerHTML=`<div class="gb">${b}</div>`;if(v=="student")gsi();if(v=="teacher")setTimeout(()=>$("#pw")&&$("#pw").focus(),50)}
function gsi(){const init=()=>{if(demo()||!window.google)return;google.accounts.id.initialize({client_id:CFG.CLIENT_ID,callback:onCred});google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large",locale:"ar"})};
 if(window.google)init();else if(!demo()&&!document.getElementById("gsi")){const s=document.createElement("script");s.id="gsi";s.src="https://accounts.google.com/gsi/client";s.onload=init;document.head.appendChild(s)}}
async function onCred(r){try{const b=r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"),p=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
 const a=await post({action:"login",idToken:r.credential});if(a.error)return gate("student","تعذّر التحقق من الحساب. حاول مرة أخرى.");
 let pr={};try{pr=JSON.parse(localStorage.getItem("afrprof:"+p.email))||{}}catch(e){}U={role:"student",email:p.email,name:pr.name||p.name||"",cls:pr.cls||"",sess:a.sess};sessionStorage.setItem("afru",JSON.stringify(U));gate("profile")}catch(e){gate("student","حدث خطأ أثناء الدخول.")}}
async function loadCfg(){if(demo())return;try{const c=await post({action:"config"});if(c&&c.quiz&&c.quiz.length==D.quiz.length){D.quiz=c.quiz;D.ptsMcq=+c.ptsMcq||D.ptsMcq;D.ptsMatch=+c.ptsMatch||D.ptsMatch;D.max=D.ptsMcq*(2+7)+D.ptsMatch*4}}catch(e){}}
async function begin(resume){GT.hidden=true;$("#out").hidden=false;await loadCfg();let sv=null;if(resume){try{sv=JSON.parse(localStorage.getItem("afrp:"+U.email))}catch(e){}}S=sv?Object.assign(blank(),sv):blank();lastKey=null;lastSc=null;lastT=Date.now();render()}
function logout(){stopV();sessionStorage.removeItem("afru");sessionStorage.removeItem("afr1");U=null;S=blank();DS.hidden=true;gate("choose")}
$("#out").onclick=logout;
GT.addEventListener("click",async e=>{const t=e.target.closest("[data-g]");if(!t)return;const g=t.dataset.g;
 if(g=="choose"||g=="student"||g=="teacher")gate(g);
 else if(g=="demo"){U={role:"student",email:"demo@local",name:"",cls:"",sess:""};gate("profile")}
 else if(g=="go"){const n=$("#nm").value.trim(),c=$("#cl").value.trim();if(!n||!c)return gate("profile","اكتب اسمك وفصلك أولًا.");U.name=n;U.cls=c;sessionStorage.setItem("afru",JSON.stringify(U));try{localStorage.setItem("afrprof:"+U.email,JSON.stringify({name:n,cls:c}))}catch(e){}
  let sv=null;try{sv=JSON.parse(localStorage.getItem("afrp:"+U.email))}catch(e){}sv&&sv.i>0&&!sv.fin?gate("resume"):begin(false)}
 else if(g=="cont")begin(true);else if(g=="new")begin(false);
 else if(g=="tlogin"){if(demo())return gate("teacher","لم يتم ربط Google Apps Script بعد.");t.disabled=true;try{const a=await post({action:"teacherLogin",password:$("#pw").value});if(a.error)return gate("teacher","كلمة السر غير صحيحة.");U={role:"teacher",token:a.token};sessionStorage.setItem("afru",JSON.stringify(U));dash()}catch(x){gate("teacher","تعذّر الاتصال بالخادم.")}}});
/* ===== لوحة المعلم ===== */
let DB=null,FC="";
async function dash(){GT.hidden=true;DS.hidden=false;DS.innerHTML='<div class="dc"><p>جارٍ تحميل البيانات…</p></div>';try{DB=await post({action:"dashboard",token:U.token});if(DB.error)throw 0}catch(e){return logout()}drawDash()}
const qLabel=id=>{const m=/^quiz:(\d+)$/.exec(id);const q=m&&D.quiz[m[1]-1];return q?q.q:id};
function drawDash(){const A=DB.attempts,cls=[...new Set(A.map(a=>a.cls))].filter(Boolean),best={};
 A.filter(a=>!FC||a.cls==FC).forEach(a=>{const k=a.email,b=best[k];if(!b)best[k]=Object.assign({n:1,done:+a.completed},a);else{b.n++;b.done=b.done||+a.completed;if(+a.points>+b.points)Object.assign(b,a,{n:b.n,done:b.done})}});
 const R=Object.values(best).sort((a,b)=>b.points-a.points),done=R.filter(r=>r.done).length,avg=R.length?Math.round(R.reduce((s,r)=>s+r.points/(r.max||1)*100,0)/R.length):0;
 const weak=R.filter(r=>!r.done||r.points/(r.max||1)<.5),ms=Object.entries(DB.missed||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const qe=D.quiz.map((q,i)=>`<div class="qe" data-qi="${i}"><b>سؤال ${i+1}</b><input data-f="q" value="${esc(q.q)}">${q.t=="s"?`<textarea data-f="m">${esc(q.m)}</textarea>`:`<div class="r">${(q.o||["صح","خطأ"]).map((o,k)=>`<input data-f="o${k}" value="${esc(o)}" ${q.t=="t"?"readonly":""}>`).join("")}</div><label>رقم الإجابة الصحيحة (1 = أول خيار)<input data-f="a" type="number" min="1" max="${(q.o||[1,2]).length}" value="${q.a+1}"></label><input data-f="h" value="${esc(q.h)}" placeholder="تلميح"><input data-f="e" value="${esc(q.e)}" placeholder="شرح">`}</div>`).join("");
 DS.innerHTML=`<div class="dc"><div style="display:flex;gap:8px;flex-wrap:wrap"><h1 style="flex:1">لوحة المعلم</h1><button class="btn" data-h="teacher">❓ شرح</button><button class="btn" data-d="refresh">تحديث</button><button class="btn" data-d="out">خروج</button></div>
 <label>تصفية حسب الفصل<select id="fc"><option value="">كل الفصول</option>${cls.map(c=>`<option ${c==FC?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
 <div class="stats"><div class="box gr"><div class="big">${R.length}</div>طلاب</div><div class="box b"><div class="big">${done}</div>أكملوا الدرس</div><div class="box yl"><div class="big">${avg}%</div>متوسط الدرجات</div><div class="box"><div class="big">${A.length}</div>محاولات</div></div>
 <h2>ترتيب الطلاب بالنقاط</h2><div style="overflow:auto"><table class="tb"><tr><th>#</th><th>الاسم</th><th>الفصل</th><th>النقاط</th><th>الأنشطة</th><th>الحالة</th><th>المحاولات</th></tr>${R.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td>${r.points} / ${r.max}</td><td>${r.acts} / 6</td><td>${r.done?"✔ مكتمل":"… غير مكتمل"}</td><td>${r.n}</td></tr>`).join("")||"<tr><td colspan=7>لا توجد بيانات بعد.</td></tr>"}</table></div>
 <h2>طلاب يحتاجون متابعة</h2>${weak.length?`<ul class="t">${weak.map(r=>`<li>${esc(r.name)} (${esc(r.cls)}): ${r.done?"درجته أقل من 50%":"لم يكمل الدرس"}</li>`).join("")}</ul>`:"<p>لا أحد حاليًا 👍</p>"}
 <h2>أكثر الأسئلة غلطًا</h2>${ms.length?`<ol class="t">${ms.map(m=>`<li>${esc(qLabel(m[0]))} — ${m[1]} خطأ</li>`).join("")}</ol>`:"<p>لا توجد أخطاء مسجّلة.</p>"}
 <h2>تعديل النقاط والأسئلة</h2><div class="r qe"><label>نقاط سؤال الاختيار<input id="pm" type="number" value="${D.ptsMcq}"></label><label>نقاط المطابقة<input id="pt" type="number" value="${D.ptsMatch}"></label></div>${qe}<button class="btn pri" data-d="save">حفظ التعديلات للطلاب</button> <span id="sm"></span></div>`}
DS.addEventListener("change",e=>{if(e.target.id=="fc"){FC=e.target.value;drawDash()}});
DS.addEventListener("click",async e=>{const t=e.target.closest("[data-d]");if(!t)return;const d=t.dataset.d;if(d=="out")logout();else if(d=="refresh")dash();
 else if(d=="save"){const q=D.quiz.map(x=>Object.assign({},x));DS.querySelectorAll(".qe[data-qi]").forEach(b=>{const i=+b.dataset.qi,f=n=>{const el=b.querySelector(`[data-f="${n}"]`);return el?el.value:null};q[i].q=f("q");if(q[i].t=="s")q[i].m=f("m");else{q[i].h=f("h");q[i].e=f("e");q[i].a=Math.max(0,(+f("a")||1)-1);if(q[i].t=="m")q[i].o=[0,1,2,3].map(k=>f("o"+k))}});
  const cfg={ptsMcq:+$("#pm").value||10,ptsMatch:+$("#pt").value||15,quiz:q};try{const r=await post({action:"saveConfig",token:U.token,config:cfg});if(r.error)throw 0;Object.assign(D,{quiz:q,ptsMcq:cfg.ptsMcq,ptsMatch:cfg.ptsMatch});D.max=D.ptsMcq*9+D.ptsMatch*4;$("#sm").textContent="✔ تم الحفظ"}catch(x){$("#sm").textContent="تعذّر الحفظ"}}});

/* ===== شرح الموقع ===== */
const HELP={student:["🎓 شرح الموقع للطالب",[["سجّل دخولك","اضغط «أنا طالب» ثم سجّل الدخول بحساب جوجل، وبعدها اكتب اسمك الكامل وفصلك."],["ابدأ الرحلة","الدرس 12 شاشة: تمهيد وخريطة وأهمية القارة ورحلات الاستكشاف وتقويم ختامي. تنقّل بزرّي «التالي» و«السابق»."],["ابن بطوطة مرشدك","يشرح لك كل شاشة بصوته وبالكتابة، ويشجّعك إذا أجبت إجابة صحيحة، ويلمّح لك إذا أخطأت. زر 🔊 يكتم الصوت أو يعيده."],["أجب واجمع النقاط","كل إجابة صحيحة تمنحك نقاطًا وتشاهد احتفالًا بالكونفيتي. وإذا أخطأت ستظهر لك إشارة تلميح لتحاول مرة أخرى."],["أدِر الكرة واستكشف الخريطة","أدِر الكرة الأرضية بإصبعك أو بالماوس، واضغط على الدوائر الوامضة في الخريطة."],["أكمل في أي وقت","إذا أغلقت الدرس فستختار بين أن تكمل من حيث توقفت أو تبدأ من جديد. ويطّلع معلمك على نتيجتك."],["احصل على الشارة","أكمل الأنشطة لتحصل على الشارة اللامعة في آخر الدرس."]]],
teacher:["👨‍🏫 شرح لوحة المعلم",[["الدخول","اضغط «أنا معلم» واكتب كلمة السر. تُحدَّد الكلمة في Google Apps Script وليس في الصفحة، فلا يستطيع الطلاب الدخول."],["الأرقام الأساسية","في الأعلى ستجد عدد الطلاب، وعدد من أكملوا الدرس، ومتوسط الدرجات، وعدد المحاولات."],["ترتيب الطلاب","جدول مرتّب بالنقاط، يعرض الفصل والأنشطة المكتملة والحالة وعدد محاولات كل طالب."],["التصفية بالفصل","اختر فصلًا من القائمة لترى نتائجه فقط، أو «كل الفصول»."],["طلاب يحتاجون متابعة","يظهر هنا الطلاب الذين لم يكملوا الدرس أو درجتهم أقل من 50%."],["أكثر الأسئلة خطأً","أكثر 5 أسئلة أخطأ فيها الطلاب، لتراجعها معهم."],["تعديل الأسئلة والنقاط","عدّل نص السؤال والخيارات والإجابة الصحيحة والتلميح ونقاط كل نوع، ثم اضغط «حفظ التعديلات للطلاب» لتظهر لهم فورًا."],["تحديث وخروج","«تحديث» يجلب آخر النتائج، و«خروج» يغلق لوحة المعلم."]]]};
let hOpener=null;
function showHelp(k){const H=HELP[k]||HELP.student,el=$("#help");hOpener=document.activeElement;el.innerHTML=`<div class="hb"><h2 id="ht">${H[0]}</h2>${H[1].map((x,i)=>`<div class="hs" style="--d:${i*.07}s"><div class="hn">${i+1}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join("")}<button class="btn pri" data-hx="1" style="width:100%;margin-top:8px">فهمت، هيّا نبدأ</button></div>`;el.hidden=false;el.querySelector("[data-hx]").focus()}
function closeHelp(){$("#help").hidden=true;if(hOpener&&hOpener.focus)hOpener.focus()}
document.addEventListener("click",e=>{const h=e.target.closest("[data-h]");if(h)return showHelp(h.dataset.h);if(e.target.closest("[data-hx]")||e.target.id=="help")closeHelp()});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&!$("#help").hidden)closeHelp()});
if(RM_)try{$("#bg").pauseAnimations()}catch(e){}
/* ===== البداية ===== */
if(U&&U.role=="teacher")dash();else if(isS()&&U.name){GT.hidden=true;$("#out").hidden=false}else gate("choose");

render();
</script>
